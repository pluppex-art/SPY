<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0B1120" />
<title>Sem conexão — S.P.Y.</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#0B1120;color:#F8FAFC;font-family:Arial,Helvetica,sans-serif;padding:24px;text-align:center}
  main{max-width:340px}
  img{width:72px;height:72px;margin-bottom:20px}
  h1{font-size:20px;margin:0 0 8px}
  p{font-size:14px;line-height:1.5;color:#94A3B8;margin:0 0 24px}
  button{background:#2563EB;color:#fff;border:0;border-radius:12px;padding:14px 22px;font-size:14px;font-weight:700;width:100%}
</style>
</head>
<body>
<main>
  <img src="/pwa-192.png" alt="S.P.Y." />
  <h1>Você está sem conexão</h1>
  <p>O S.P.Y. precisa de internet para mostrar seus leads, tarefas e conversas atualizados. Verifique o Wi-Fi ou os dados móveis e tente de novo.</p>
  <button onclick="location.reload()">Tentar novamente</button>
</main>
<script>addEventListener('online',function(){location.reload()})</script>
</body>
</html>
