name: Lembretes por e-mail (agendado)

# Dispara tarefas perto do prazo/vencidas, reuniões começando e pagamentos recebidos.
# Usa o mesmo secret CRON_SECRET do google-sync (mesmo valor da variável CRON_SECRET na Vercel).
# O GitHub pode atrasar execuções agendadas em alguns minutos em horários de pico.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Acionar lembretes de notificação
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Secret CRON_SECRET não configurado no repositório."
            exit 1
          fi
          curl --fail-with-body -sS --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.spycrm.com.br/api/notifications/cron"
