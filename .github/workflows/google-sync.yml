name: Google sync (agendado)

# Substitui o Vercel Cron (o plano atual não aceita agendamento a cada 30 min).
# Exige o secret CRON_SECRET no GitHub — o mesmo valor da variável CRON_SECRET na Vercel.
# O GitHub pode atrasar execuções agendadas em alguns minutos em horários de pico.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  google-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Acionar renovação e sincronização do Google
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Secret CRON_SECRET não configurado no repositório."
            exit 1
          fi
          curl --fail-with-body -sS --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.spycrm.com.br/api/integrations/google/cron"
